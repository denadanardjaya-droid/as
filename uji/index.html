<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>After-Sales PT3D</title>
<style>
:root{--ink:#1F2D42;--mut:#5B6B80;--line:#DDD8CC;--bg:#F4F2EC;--navy:#14263F;--pri:#0F766E;--pri2:#0B5F58;--ok:#1E7B4A;--okbg:#E6F4EC;--red:#B42318;--redbg:#FDECEA;--chip:#EEF4F8}
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;background:var(--bg);color:var(--ink);font-size:16px;line-height:1.45}
header{background:var(--navy);color:#fff;padding:12px 16px;display:flex;align-items:center;justify-content:space-between;gap:10px;position:sticky;top:0;z-index:5}
header b{font-size:16px}
header button{background:rgba(255,255,255,.16);color:#fff;border:0;border-radius:8px;padding:7px 10px;font-size:13px}
main{max-width:560px;margin:0 auto;padding:14px 14px 60px}
h1{font-size:19px;margin:6px 0 10px}
h2{font-size:14px;margin:18px 0 6px;color:var(--mut);text-transform:uppercase;letter-spacing:.04em}
.card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px;margin:10px 0}
.kode{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:24px;font-weight:700;background:var(--chip);border-radius:10px;padding:10px;text-align:center;margin:4px 0 10px}
label{display:block;font-size:14px;font-weight:600;margin:12px 0 5px}
input[type=text],input[type=email],input[type=password],input[type=date],input[type=search],select{width:100%;padding:12px;border:1px solid #B9C4CE;border-radius:10px;font-size:16px;background:#fff;color:var(--ink)}
.btn{display:block;width:100%;padding:14px;border:0;border-radius:10px;background:var(--pri);color:#fff;font-size:16px;font-weight:600;margin-top:14px}
.btn:active{background:var(--pri2)}
.btn.s{background:#fff;color:var(--pri);border:1px solid var(--pri)}
.btn[disabled]{opacity:.55}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid #B9C4CE;background:#fff;border-radius:999px;padding:9px 14px;font-size:15px;color:var(--ink)}
.chip.on{background:var(--pri);border-color:var(--pri);color:#fff}
.item{display:block;width:100%;text-align:left;background:#fff;border:1px solid var(--line);border-radius:10px;padding:11px 12px;margin:6px 0;font-size:15px;color:var(--ink)}
.item b{display:block}
.item span{color:var(--mut);font-size:13px}
.mut{color:var(--mut);font-size:14px}
.err{color:var(--red);background:var(--redbg);border-radius:8px;padding:10px;margin-top:10px;font-size:14px}
.err:empty{display:none}
.okb{color:var(--ok);background:var(--okbg);border-radius:10px;padding:12px;font-weight:600}
.kv{display:grid;grid-template-columns:110px 1fr;gap:6px 10px;font-size:15px}
.kv span:nth-child(odd){color:var(--mut)}
table{width:100%;border-collapse:collapse;font-size:14px}
td,th{padding:7px 4px;border-bottom:1px solid var(--line);text-align:left}
td.n,th.n{text-align:right}
.row{display:flex;gap:8px}
.row>*{flex:1}
.check{display:flex;align-items:center;gap:10px;margin-top:14px;font-size:15px}
.check input{width:22px;height:22px}
.uji{background:#FFF4CE;color:#6B4E00;border-bottom:1px solid #E8C96A;padding:8px 14px;font-size:13px;font-weight:600;text-align:center}
.bar{height:10px;background:#E3E9EE;border-radius:99px;overflow:hidden;margin:8px 0}
.bar{display:flex}.bar i{display:block;height:100%;background:var(--ok)}.bar i.u{background:#9CCFB3}
tr.sum th{border-top:2px solid var(--line)}td.rg{line-height:1.25}td.rg small{color:var(--mut)}
.uji{position:sticky;top:48px;z-index:4}
.tile{display:block;width:100%;text-align:left;background:#FFFEFB;border:1px solid var(--line);border-radius:14px;padding:18px 16px;margin:12px 0;color:var(--ink);font-size:16px}
.tile b{display:block;font-size:18px;color:var(--navy);margin-bottom:4px}
.tile span{color:var(--mut);font-size:14px}
.tag{display:inline-block;font-size:12px;font-weight:600;padding:2px 9px;border-radius:20px;background:#DCEFEA;color:#0F5E59}
.tag.o{background:#FCE7CF;color:#A85A12}.tag.g{background:#E4E7EC;color:#344054}.tag.r{background:#FBE0DD;color:var(--red)}
.wo{display:block;width:100%;text-align:left;font:inherit;color:inherit}
.wo b{color:var(--navy)}
.rowb{display:flex;justify-content:space-between;gap:8px;align-items:center}
.tabs{display:flex;gap:8px;margin-bottom:6px}.tabs .chip{flex:1;text-align:center}
.units{max-height:260px;overflow:auto;border:1px solid var(--line);border-radius:10px;background:#fff}
.u{display:flex;gap:10px;align-items:center;padding:10px 12px;border-bottom:1px solid #EEEAE0;font-size:14px;font-weight:400;margin:0}.u:last-child{border:0}
.u input{width:20px;height:20px;flex:0 0 20px}
textarea{width:100%;min-height:84px;padding:12px;border:1px solid #B9C4CE;border-radius:10px;font:inherit;background:#fff;color:var(--ink)}
.grid4{display:grid;grid-template-columns:1fr 1fr;gap:8px}.stat{background:#FFFEFB;border:1px solid var(--line);border-radius:12px;padding:12px}.stat b{display:block;font-size:24px;color:var(--navy)}.stat span{font-size:13px;color:var(--mut)}
.thumbs{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}.thumbs img{width:76px;height:76px;object-fit:cover;border-radius:8px;border:1px solid var(--line)}
input[type=file]{width:100%;padding:10px;border:1px dashed #B9C4CE;border-radius:10px;background:#fff;font-size:14px}
.lnk{background:none;border:0;color:var(--pri);font-size:14px;padding:6px 0;text-decoration:underline}
pre{white-space:pre-wrap;font-family:inherit;font-size:14px;background:var(--chip);border-radius:10px;padding:10px;margin:8px 0}
</style>
</head>
<body>
<header><b id="ttl">After-Sales PT3D</b><span><button id="home" hidden>Beranda</button> <button id="out" hidden>Keluar</button></span></header>
<div class="uji" id="uji" hidden>VERSI UJI. Hanya data "RS UJI (percobaan)" yang tampil. Kode stiker: 99001 ke atas.</div>
<main id="v"><p class="mut">Memuat...</p></main>
<script>
"use strict";
// ---------------------------------------------------------------------
// PT3D After-Sales - work order, foto, penyelesaian, verifikasi, stiker QR, progres (v8, 25 Nov 2026)
// Kunci di bawah adalah kunci PUBLIK (publishable). Keamanan data dijaga
// oleh login dan aturan akses (RLS) di database, bukan oleh kunci ini.
// ---------------------------------------------------------------------
const SB_URL="https://bvguqlqpiyyzoakpoloc.supabase.co";
const SB_KEY="sb_publishable_AXbdfnJXpgH7a-bqZ9hO8g_0S-Hi2hj";
const KOLOM="id,customer_id,nama,merk,tipe,sn,departemen,ruangan,menetap,status,tgl_instal,kode_qr,catatan,didaftar_pada";
const $=s=>document.querySelector(s), v=$("#v");
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const hariIni=()=>new Date().toLocaleDateString("en-CA",{timeZone:"Asia/Jakarta"});
const tgl=d=>d?new Date(d).toLocaleDateString("id-ID",{day:"numeric",month:"short",year:"numeric",timeZone:"Asia/Jakarta"}):"-";
const ls={get:k=>{try{return localStorage.getItem(k)}catch(e){return null}},set:(k,x)=>{try{localStorage.setItem(k,x)}catch(e){}}};
const normKode=s=>{s=String(s||"").trim().toUpperCase();const m=s.match(/(?:3D-?)?(\d{1,5})$/);return m?"3D-"+m[1].padStart(5,"0"):""};
const kodeSah=k=>/^3D-\d{5}$/.test(k);
let sb=null,me=null,RS=[],kode="";
const UJI=/\/uji(\/|$)/.test(location.pathname);
const rsUji=n=>/^RS UJI/i.test(n||"");
const rsNama=id=>(RS.find(r=>r.id==id)||{}).nama||"-";
const alatTxt=a=>[a.nama,a.merk,a.tipe].filter(Boolean).join(" ");
const kunciSN=s=>String(s||"").replace(/\s/g,"").toUpperCase();
const BELUM_PASANG=["Akan diinstal","Sudah uji fungsi"];
const RUANG={};
async function ruanganRS(cid){
  if(RUANG[cid])return RUANG[cid];
  try{const r=await sb.rpc("daftar_ruangan",{p_customer:cid});if(r.error||!Array.isArray(r.data))return [];RUANG[cid]=r.data;return r.data}catch(e){return []}
}
const samakanDept=(t,L)=>{t=String(t||"").trim();const k=t.toLowerCase();return (L||[]).find(x=>String(x).toLowerCase()===k)||t};
async function snKembar(cid,sn,kecualiId){
  try{let q=sb.from("alat").select("id,nama,merk,tipe,sn,departemen").eq("customer_id",cid).eq("sn_kunci",kunciSN(sn));
    if(kecualiId!=null)q=q.neq("id",kecualiId);
    const r=await q.limit(5);if(r.error)return [];return r.data||[]}catch(e){return []}
}
const bedaTipe=(o,tipe)=>!!(o.tipe&&tipe&&String(o.tipe).trim().toLowerCase()!==String(tipe).trim().toLowerCase());

function pesanGalat(e){
  const m=(e&&(e.message||e.error_description))||String(e||"");
  if(/alat_kode_qr_unik/.test(m))return "Stiker ini sudah terdaftar pada alat lain. Muat ulang halaman untuk melihatnya.";
  if(/alat_merk_tipe_sn_unik/.test(m))return "Nomor seri ini sudah dipakai alat lain dengan merk dan tipe yang sama. Periksa lagi nomor serinya.";
  if(/sudah terdaftar pada alat ini|sudah ada di daftar RS ini|Foto gagal diunggah|sudah tidak berstatus|wajib diisi|boleh menutup|harus diselesaikan/.test(m))return m;
  if(/row-level security|permission denied/i.test(m))return "Akun ini tidak punya izin untuk tindakan tersebut.";
  if(/Failed to fetch|NetworkError|Load failed/i.test(m))return "Tidak ada sambungan internet. Data BELUM tersimpan, coba lagi setelah sinyal ada.";
  return "Gagal: "+m;
}
function judul(t){$("#ttl").textContent=t}
function tombolAtas(on){$("#out").hidden=!on;$("#home").hidden=!on}

// Pustaka Supabase dimuat dari CDN (versi dikunci), dengan dua cadangan.
const PUSTAKA=["https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.119.2/dist/umd/supabase.js",
               "https://unpkg.com/@supabase/supabase-js@2.119.2/dist/umd/supabase.js","supabase.js"];
const muatSkrip=src=>new Promise((ok,no)=>{const s=document.createElement("script");s.src=src;s.onload=ok;s.onerror=no;document.head.appendChild(s)});
async function mulai(){
  for(const src of PUSTAKA){if(window.supabase)break;try{await muatSkrip(src)}catch(e){}}
  if(!window.supabase){v.innerHTML='<div class="err">Aplikasi gagal dimuat karena sambungan internet. Periksa sinyal lalu muat ulang halaman.</div><button class="btn s" onclick="location.reload()">Muat ulang</button>';return}
  sb=window.supabase.createClient(SB_URL,SB_KEY);
  $("#uji").hidden=!UJI;
  kode=normKode(new URLSearchParams(location.search).get("u"));
  if(!kodeSah(kode))kode="";
  $("#out").onclick=async()=>{await sb.auth.signOut();me=null;layarLogin()};
  $("#home").onclick=()=>{location.href=location.pathname};
  let ses=null;
  try{ses=(await sb.auth.getSession()).data.session}catch(e){}
  if(!ses)return layarLogin();
  await sesudahLogin(ses.user);
}
async function sesudahLogin(user){
  v.innerHTML='<p class="mut">Memuat...</p>';
  try{
    const r=await sb.from("pengguna").select("nama,peran,aktif").eq("id",user.id).maybeSingle();
    if(r.error)throw r.error;
    me=r.data&&r.data.aktif?Object.assign({id:user.id},r.data):null;
    if(!me){tombolAtas(false);$("#out").hidden=false;
      v.innerHTML='<div class="card"><b>Akun belum diberi akses</b><p class="mut">Email '+esc(user.email)+' berhasil login, tetapi belum terdaftar sebagai pengguna aktif. Hubungi manajemen PT3D.</p></div>';return}
    const c=await sb.from("customer").select("id,nama").order("nama");
    if(c.error)throw c.error;RS=(c.data||[]).filter(r=>UJI?rsUji(r.nama):!rsUji(r.nama));
    tombolAtas(true);
    if(kode)await bukaKode(kode);else await layarBeranda();
  }catch(e){v.innerHTML='<div class="err">'+esc(pesanGalat(e))+'</div><button class="btn s" onclick="location.reload()">Coba lagi</button>'}
}

function layarLogin(){
  tombolAtas(false);judul("After-Sales PT3D");
  v.innerHTML=(kode?'<div class="kode">'+esc(kode)+'</div>':'')+
   '<div class="card"><h1>Masuk</h1><p class="mut">Khusus petugas PT Dena Danar Djaya.</p>'+
   '<label for="em">Email</label><input type="email" id="em" autocomplete="username" inputmode="email">'+
   '<label for="pw">Kata sandi</label><input type="password" id="pw" autocomplete="current-password">'+
   '<div class="err" id="err"></div><button class="btn" id="go">Masuk</button></div>';
  $("#em").value=ls.get("pt3d_email")||"";
  const masuk=async()=>{
    const em=$("#em").value.trim(),pw=$("#pw").value;
    if(!em||!pw){$("#err").textContent="Isi email dan kata sandi.";return}
    $("#go").disabled=true;$("#err").textContent="";
    try{const r=await sb.auth.signInWithPassword({email:em,password:pw});
      if(r.error){$("#err").textContent=/Invalid login/i.test(r.error.message)?"Email atau kata sandi salah.":pesanGalat(r.error);$("#go").disabled=false;return}
      ls.set("pt3d_email",em);await sesudahLogin(r.data.user);
    }catch(e){$("#err").textContent=pesanGalat(e);$("#go").disabled=false}
  };
  $("#go").onclick=masuk;$("#pw").onkeydown=e=>{if(e.key==="Enter")masuk()};
}

async function hitung(cid,berstiker){
  let q=sb.from("alat").select("id",{count:"exact",head:true}).eq("customer_id",cid);
  if(berstiker)q=q.not("kode_qr","is",null);
  const r=await q;if(r.error)throw r.error;return r.count||0;
}
// ---------- beranda: menu ----------------------------------------------
async function layarBeranda(){
  judul("After-Sales PT3D");window.scrollTo(0,0);
  v.innerHTML='<p class="mut">Halo, '+esc(me.nama)+' ('+esc(me.peran)+').</p>'+
   '<button class="tile" id="mWO"><b>Work order</b><span>Daftar pekerjaan dan lapor pekerjaan baru</span></button>'+
   (bolehVerif()?'<button class="tile" id="mVR"><b>Verifikasi <span class="tag" id="nVR" hidden></span></b><span>Periksa pekerjaan yang sudah selesai, tutup atau kembalikan</span></button>':'')+
   '<button class="tile" id="mST"><b>Daftarkan stiker</b><span>Tempel stiker QR ke alat dan catat lokasinya</span></button>'+
   '<button class="tile" id="mPR"><b>Progres instalasi</b><span>Rencana, uji fungsi dan terpasang per ruangan, salin ke WA</span></button>';
  $("#mWO").onclick=()=>layarWOList();$("#mST").onclick=()=>layarStiker();$("#mPR").onclick=()=>layarProgres();
  if($("#mVR")){$("#mVR").onclick=()=>layarVerif();
    try{const r=await sb.from("work_order").select("id",{count:"exact",head:true}).in("customer_id",RS.map(x=>x.id)).eq("status","Menunggu verifikasi");
      const n=$("#nVR");if(n&&!r.error&&r.count){n.textContent=r.count+" menunggu";n.hidden=false}}catch(e){}}
}
// ---------- verifikasi (operasi dan manajemen) --------------------------
let filtV="Menunggu verifikasi";
async function layarVerif(pesan){
  judul("Verifikasi");window.scrollTo(0,0);v.innerHTML='<p class="mut">Memuat...</p>';
  try{
    const r=await sb.from("work_order").select(KOLOM_WO).in("customer_id",RS.map(x=>x.id)).order("dibuat",{ascending:false}).limit(500);
    if(r.error)throw r.error;const W=r.data||[],hari7=Date.now()-7*864e5;
    const nMV=W.filter(w=>w.status==="Menunggu verifikasi").length,nDK=W.filter(w=>w.status==="Dikerjakan").length,
          nLama=W.filter(w=>w.status==="Dikerjakan"&&new Date(w.dibuat).getTime()<hari7).length,nTL=W.filter(w=>w.tindak_lanjut&&w.status!=="Dikerjakan").length;
    const gambar=()=>{
      const L=filtV==="lama"?W.filter(w=>w.status==="Dikerjakan"&&new Date(w.dibuat).getTime()<hari7):filtV==="tl"?W.filter(w=>w.tindak_lanjut&&w.status!=="Dikerjakan"):W.filter(w=>w.status===filtV);
      const fase={};W.forEach(w=>{const f=w.fase||"-";fase[f]=fase[f]||{b:0,v:0,t:0};fase[f][w.status==="Dikerjakan"?"b":w.status==="Menunggu verifikasi"?"v":"t"]++});
      v.innerHTML=(pesan?'<div class="okb">'+esc(pesan)+'</div>':'')+
        '<div class="grid4"><div class="stat"><b>'+nMV+'</b><span>Menunggu verifikasi</span></div><div class="stat"><b>'+nDK+'</b><span>Sedang dikerjakan</span></div><div class="stat"><b>'+nLama+'</b><span>Dikerjakan lebih dari 7 hari</span></div><div class="stat"><b>'+nTL+'</b><span>Perlu tindak lanjut</span></div></div>'+
        '<div class="chips" style="margin:12px 0">'+[["Menunggu verifikasi","Menunggu verifikasi"],["Dikerjakan","Dikerjakan"],["lama","Lebih dari 7 hari"],["tl","Tindak lanjut"],["Ditutup","Ditutup"]].map(x=>'<button class="chip'+(filtV===x[0]?" on":"")+'" data-fv="'+x[0]+'">'+x[1]+'</button>').join("")+'</div>'+
        (L.map(w=>'<button class="card wo" data-id="'+esc(w.id)+'"><div class="rowb"><b>'+esc(w.nomor)+'</b><span>'+tagWO(w)+'</span></div><div>'+esc(rsNama(w.customer_id))+(w.departemen?" - "+esc(w.departemen):"")+'</div><div class="mut">'+esc((w.jenis||[]).join(", "))+' · '+esc(w.fase||"-")+(w.hasil?' · Hasil: '+esc(w.hasil):'')+'</div><div class="mut">Dibuat '+tglJam(w.dibuat)+(w.selesai_pada?' · selesai '+tglJam(w.selesai_pada):'')+'</div></button>').join("")||'<p class="mut">Tidak ada work order di daftar ini.</p>')+
        '<h2>Rekap per fase</h2><div class="card"><table><tr><th>Fase</th><th class="n">Dikerjakan</th><th class="n">Verifikasi</th><th class="n">Ditutup</th></tr>'+Object.keys(fase).sort().map(f=>'<tr><td>'+esc(f)+'</td><td class="n">'+fase[f].b+'</td><td class="n">'+fase[f].v+'</td><td class="n">'+fase[f].t+'</td></tr>').join("")+'</table></div>'+tombolBeranda;
      pasangBeranda();pesan="";
      v.querySelectorAll("[data-fv]").forEach(b=>b.onclick=()=>{filtV=b.dataset.fv;gambar()});
      v.querySelectorAll(".wo").forEach(b=>b.onclick=()=>layarWODetail(b.dataset.id,"","verif"));
    };
    gambar();
  }catch(e){v.innerHTML='<div class="err">'+esc(pesanGalat(e))+'</div>'+tombolBeranda;pasangBeranda()}
}
const tombolBeranda='<button class="btn s" id="keBeranda">Kembali ke Beranda</button>';
const pasangBeranda=()=>{const b=$("#keBeranda");if(b)b.onclick=()=>layarBeranda()};
async function layarProgres(){
  judul("Progres instalasi");window.scrollTo(0,0);
  v.innerHTML='<div id="pwo"><p class="mut">Memuat...</p></div>'+tombolBeranda;pasangBeranda();
  await muatProgres();
}
async function layarStiker(){
  judul("Daftarkan stiker");window.scrollTo(0,0);
  v.innerHTML='<div class="card"><p class="mut" style="margin-top:0">Cara tercepat: pindai stiker dengan kamera HP, halaman ini terbuka sendiri dengan kodenya. Atau ketik angka di stiker:</p>'+
   '<label for="kd">Kode stiker</label><div class="row"><input type="text" id="kd" inputmode="numeric" placeholder="contoh: 15 atau 3D-00015"></div>'+
   '<div class="err" id="err"></div><button class="btn" id="buka">Buka</button></div>'+
   '<h2>Stiker per rumah sakit</h2><div class="card" id="prog"><p class="mut">Menghitung...</p></div>'+tombolBeranda;pasangBeranda();
  const buka=()=>{const k=normKode($("#kd").value);if(!kodeSah(k)){$("#err").textContent="Kode tidak dikenali. Ketik angka pada stiker, misalnya 15.";return}location.href=location.pathname+"?u="+k};
  $("#buka").onclick=buka;$("#kd").onkeydown=e=>{if(e.key==="Enter")buka()};
  try{
    let h='<table><tr><th>Rumah sakit</th><th class="n">Unit</th><th class="n">Berstiker</th></tr>',T=0,S=0;
    for(const r of RS){const t=await hitung(r.id,false),s=await hitung(r.id,true);T+=t;S+=s;h+='<tr><td>'+esc(r.nama)+'</td><td class="n">'+t+'</td><td class="n">'+s+'</td></tr>'}
    h+='<tr><th>Total</th><th class="n">'+T+'</th><th class="n">'+S+'</th></tr></table>';
    if($("#prog"))$("#prog").innerHTML=h;
  }catch(e){if($("#prog"))$("#prog").innerHTML='<div class="err">'+esc(pesanGalat(e))+'</div>'}
}

// ---------- work order: daftar, rincian, lapor baru --------------------
const JENIS=["Instalasi","Training alat","Uji fungsi alat","Pemeriksaan alat","Perbaikan","Maintenance alat","Demo alat","Serah terima","Visit","Upgrade software","Pengiriman/pengambilan unit","Dokumen","Lainnya"];

function faseDari(j,asal){
  if(j.some(x=>["Demo alat","Visit"].includes(x))&&asal!=="Komplain RS")return "Pre Project";
  if(j.some(x=>["Instalasi","Uji fungsi alat","Serah terima"].includes(x)))return "Instalasi";
  if(j.includes("Maintenance alat")&&asal!=="Komplain RS")return "Post Project: PM";
  if(asal==="Komplain RS")return "Post Project: Komplain";
  return "Post Project: Non PM";
}

  return (ORANG.find(o=>o.id===id)||{}).nama||"petugas";

async function alatWO(woId){
  const a=await sb.from("wo_alat").select("alat_id").eq("wo_id",woId).limit(1000);if(a.error)throw a.error;
  const ids=(a.data||[]).map(x=>x.alat_id),out=[];
  for(let i=0;i<ids.length;i+=150){const r=await sb.from("alat").select("id,nama,merk,tipe,sn").in("id",ids.slice(i,i+150));if(r.error)throw r.error;out.push(...(r.data||[]))}
  return out;
}
function ringkasAlat(us){
  const g={};us.forEach(u=>{const k=[u.nama,u.tipe].filter(Boolean).join(" ");(g[k]=g[k]||[]).push(u.sn||"tanpa SN")});
  return Object.entries(g).map(([k,s])=>k+(s.length>3?" ("+s.length+" unit)":" (SN "+s.join(", ")+")")).join("; ")||"-";
}

    (w.tgl_lapor?"\nTgl "+(w.asal==="Komplain RS"?"komplain":"permintaan")+": "+tgl2(w.tgl_lapor):"")+(w.tgl_kunjungan?"\nTgl kunjungan: "+tgl2(w.tgl_kunjungan):"")+
    (w.prioritas?"\nPrioritas: "+w.prioritas:"")+(w.pelapor?"\nPelapor: "+w.pelapor:"")+"\nKeterangan: "+(w.cerita||"-");
  if(w.hasil)t+="\n\nHasil: "+w.hasil+(w.catatan?"\nCatatan: "+w.catatan:"")+(w.petugas_rs?"\nDiketahui: "+w.petugas_rs:"")+(w.tgl_bast?"\nTgl BAST: "+tgl2(w.tgl_bast):"")+(w.tindak_lanjut?"\nPerlu tindak lanjut: ya":"");

// ---------- foto: perkecil, unggah, tampilkan --------------------------
const HASIL=["Selesai","Dipantau","Menunggu part","Eskalasi ke prinsipal","Bukan masalah alat"];
const HINT={"Selesai":"Tuntas, tidak perlu dipantau lagi.","Dipantau":"Sudah ditangani, masih dipantau beberapa hari.","Menunggu part":"Belum tuntas karena menunggu suku cadang.","Eskalasi ke prinsipal":"Tidak bisa ditangani sendiri, diteruskan ke prinsipal.","Bukan masalah alat":"Penyebabnya di luar alat, misalnya instalasi RS atau cara pakai."};
async function kecilkan(file){
  try{
    const bmp=await createImageBitmap(file),S=1600,k=Math.min(1,S/Math.max(bmp.width,bmp.height));
    const c=document.createElement("canvas");c.width=Math.round(bmp.width*k);c.height=Math.round(bmp.height*k);
    c.getContext("2d").drawImage(bmp,0,0,c.width,c.height);
    const b=await new Promise(r=>c.toBlob(r,"image/jpeg",0.8));
    return b||file;
  }catch(e){return file}
}
async function unggahFoto(woId,files,jenis){
  let n=0;
  for(const f of files){
    const blob=await kecilkan(f),path=woId+"/"+Date.now()+"-"+(n++)+"-"+Math.random().toString(36).slice(2,7)+".jpg";
    const u=await sb.storage.from("bukti").upload(path,blob,{contentType:"image/jpeg",upsert:false});
    if(u.error)throw new Error("Foto gagal diunggah: "+(u.error.message||u.error));
    const l=await sb.from("lampiran").insert({wo_id:woId,jenis:jenis,path:path});
    if(l.error)throw l.error;
  }
  return n;
}
async function fotoWO(woId){
  const l=await sb.from("lampiran").select("id,jenis,path,dibuat").eq("wo_id",woId).order("dibuat");
  if(l.error||!(l.data||[]).length)return [];
  const s=await sb.storage.from("bukti").createSignedUrls(l.data.map(x=>x.path),3600);
  const peta={};((s&&s.data)||[]).forEach(x=>{if(x&&x.signedUrl)peta[x.path]=x.signedUrl});
  return l.data.map(x=>Object.assign({url:peta[x.path]||""},x));
}
function htmlFoto(F){
  if(!F.length)return "";
  const g={};F.forEach(x=>(g[x.jenis]=g[x.jenis]||[]).push(x));
  return '<h2>Foto</h2><div class="card">'+Object.keys(g).map(j=>'<div class="mut" style="font-weight:600;margin-top:4px">'+esc(j)+' ('+g[j].length+')</div><div class="thumbs">'+g[j].map(x=>x.url?'<a href="'+esc(x.url)+'" target="_blank" rel="noopener"><img src="'+esc(x.url)+'" alt="'+esc(j)+'" loading="lazy"></a>':'<span class="mut">(foto tidak bisa dimuat)</span>').join("")+'</div>').join("")+'</div>';
}
// kotak pilih foto yang tetap ingat pilihannya walau layar digambar ulang
function kotakFoto(id,daftar,label){
  return '<label for="'+id+'">'+esc(label)+'</label><input type="file" id="'+id+'" accept="image/*" multiple>'+
    (daftar.length?'<div class="mut" style="margin-top:6px">'+daftar.length+' foto dipilih: '+esc(daftar.map(f=>f.name||"foto").join(", ").slice(0,90))+' <button type="button" class="lnk" data-hapusfoto="'+id+'">hapus semua</button></div>':'');
}
function pasangFoto(id,daftar,ulang){
  const el=$("#"+id);if(el)el.onchange=()=>{for(const f of el.files)daftar.push(f);ulang()};
  const h=v.querySelector('[data-hapusfoto="'+id+'"]');if(h)h.onclick=()=>{daftar.length=0;ulang()};
}

async function layarSelesai(w,us){

    if(g("#ctt")!=null)d.catatan=g("#ctt");if(g("#ptg")!=null)d.petugas=g("#ptg");if(g("#bast")!=null)d.bast=g("#bast");if($("#tdk"))d.tindak=$("#tdk").checked};

      '<label for="ctt">Catatan pekerjaan</label><textarea id="ctt" placeholder="Apa yang dikerjakan, temuan, saran">'+esc(d.catatan)+'</textarea>'+
      '<label for="ptg">Petugas RS yang mengetahui</label><input type="text" id="ptg" placeholder="Nama dan jabatan" value="'+esc(d.petugas)+'">'+
      kotakFoto("fBukti",d.bukti,"Foto bukti (wajib): bersama petugas RS atau bersama alat")+
      (inst?'<label for="bast">Tanggal BAST (wajib bila hasilnya Selesai)</label><input type="date" id="bast" value="'+esc(d.bast)+'"><div class="mut">Tanggal ini menjadi awal garansi semua alat di work order ini setelah diverifikasi.</div>'+
            kotakFoto("fBA",d.ba,"Foto BAST atau berita acara yang sudah ditandatangani"):
            kotakFoto("fBA",d.ba,"Foto berita acara yang sudah ditandatangani (bila ada)"))+
      '<label class="check"><input type="checkbox" id="tdk"'+(d.tindak?" checked":"")+'> Perlu tindak lanjut</label>'+
      '<div class="mut" id="gps" style="margin-top:10px">'+(d.pos?"Lokasi tercatat.":"Mencatat lokasi...")+'</div>'+
      '<div class="err" id="err"></div><button class="btn" id="kirim">Kirim untuk diverifikasi</button><button class="btn s" id="batalS">Batal</button>';
    v.querySelectorAll("[data-hasil]").forEach(b=>b.onclick=()=>{simpanIsian();d.hasil=b.dataset.hasil;gambar()});
    const ulang=()=>{simpanIsian();gambar()};
    pasangFoto("fBukti",d.bukti,ulang);pasangFoto("fBA",d.ba,ulang);
    $("#batalS").onclick=()=>layarWODetail(w.id);
    $("#kirim").onclick=async()=>{
      simpanIsian();const E=$("#err"),B=$("#kirim");

    };

// ---------- progres work order instalasi ------------------------------
const tglPendek=d=>new Date(d+"T00:00:00+07:00").toLocaleDateString("id-ID",{weekday:"short",day:"numeric",month:"short",timeZone:"Asia/Jakarta"});
const angkaProgres=p=>{const t=p.target||0,baru=p.terpasang!=null,pas=baru?p.terpasang:(p.terdaftar||0),uji=baru?(p.uji||0):0;
  return {t,pas,uji,lolos:pas+uji,pct:t?Math.min(100,Math.round(pas*100/t)):0,pctU:t?Math.min(100,Math.round((pas+uji)*100/t)):0,R:p.per_ruangan||[]}};
const tipePendek=t=>String(t||"").split(" ")[0];
function ruangGabung(R){const m=[];R.forEach(x=>{let g=m.find(y=>y.ruangan===x.ruangan);if(!g){g={ruangan:x.ruangan,isi:[]};m.push(g)}g.isi.push(x)});return m}
function teksProgres(p){
  const a=angkaProgres(p),hi=hariIni();
  let s="*Progres instalasi "+p.nomor+"*\n"+p.rs+"\n"+
    "Terpasang di ruangan: "+a.pas+(a.t?" dari "+a.t+" unit ("+a.pct+"%)":" unit")+"\n";
  if(a.uji)s+="Sudah uji fungsi: "+a.lolos+" unit ("+a.uji+" belum di ruangan)\n";
  if(a.t)s+=(a.uji?"Belum uji fungsi: ":"Sisa: ")+Math.max(a.t-a.lolos,0)+" unit\n";
  if(a.R.length)s+="\nPer ruangan (rencana / uji fungsi / terpasang):\n"+ruangGabung(a.R).map(g=>"- "+g.ruangan+": "+g.isi.map(x=>tipePendek(x.tipe)+" "+x.rencana+"/"+x.uji+"/"+x.terpasang).join(", ")).join("\n")+"\n";
  else{
    if(p.per_tipe.length)s+="\nPer tipe:\n"+p.per_tipe.map(x=>"- "+x.tipe+": "+x.n).join("\n")+"\n";
    if(p.per_lokasi.length)s+="\nPer ruangan:\n"+p.per_lokasi.map(x=>"- "+x.lokasi+": "+x.n).join("\n")+"\n";
  }
  if(p.per_hari.length){const hn=(p.per_hari.find(h=>h.tgl===hi)||{n:0}).n;s+="\nStiker terdaftar: "+p.per_hari.reduce((n,h)=>n+h.n,0)+" unit (hari ini "+hn+")\n"}
  if(a.R.length&&p.rencana_total&&a.t>p.rencana_total)s+="\nRencana ruangan dari RS baru mencakup "+p.rencana_total+" dari "+a.t+" unit.\n";
  s+="\nCatatan: terpasang = sudah diserahkan ke ruangan. Uji fungsi = lolos uji, bisa masih disimpan.\nPer "+new Date().toLocaleString("id-ID",{day:"numeric",month:"short",year:"numeric",hour:"2-digit",minute:"2-digit",timeZone:"Asia/Jakarta"})+" WIB";
  return s;
}
async function muatProgres(){
  const el=$("#pwo");if(!el)return;
  try{
    const r=await sb.rpc("progres_instalasi");if(r.error)throw r.error;
    const P=(r.data||[]).filter(p=>UJI?rsUji(p.rs):!rsUji(p.rs));
    if(!P.length){el.innerHTML='<div class="card"><p class="mut">Tidak ada work order instalasi yang sedang berjalan.</p></div>';return}
    el.innerHTML=P.map((p,i)=>{const a=angkaProgres(p);
      let tb="";
      if(a.R.length){let sr=0,su=0,sp=0;
        tb='<table style="margin-top:8px"><tr><th>Ruangan</th><th class="n">Rencana</th><th class="n">Uji</th><th class="n">Pasang</th></tr>'+
          a.R.map(x=>{sr+=x.rencana;su+=x.uji;sp+=x.terpasang;return '<tr><td class="rg">'+esc(x.ruangan)+'<br><small>'+esc(tipePendek(x.tipe))+'</small></td><td class="n">'+x.rencana+'</td><td class="n">'+x.uji+'</td><td class="n">'+x.terpasang+(x.rencana&&x.terpasang>=x.rencana?' ✓':'')+'</td></tr>'}).join("")+
          '<tr class="sum"><th>Jumlah</th><th class="n">'+sr+'</th><th class="n">'+su+'</th><th class="n">'+sp+'</th></tr></table>'+
          '<div class="mut" style="margin-top:6px">Uji = sudah lolos uji fungsi untuk ruangan itu. Pasang = sudah diserahkan ke ruangan.'+(a.t>sr?' Rencana RS baru mencakup '+sr+' dari '+a.t+' unit.':'')+(a.lolos>su?' '+(a.lolos-su)+' unit tercatat di ruangan di luar rencana.':'')+'</div>'}
      return '<div class="card"><b>'+esc(p.nomor)+'</b> <span class="mut">'+esc(p.rs)+'</span>'+
        '<div class="bar"><i style="width:'+a.pct+'%"></i><i class="u" style="width:'+Math.max(a.pctU-a.pct,0)+'%"></i></div>'+
        '<div><b>'+a.pas+'</b>'+(a.t?' dari '+a.t+' unit terpasang ('+a.pct+'%)':' unit terpasang')+'</div>'+
        (a.uji?'<div><b>'+a.lolos+'</b> sudah uji fungsi, '+a.uji+' di antaranya belum di ruangan</div>':'')+
        (tb||(p.per_lokasi.length?'<div class="mut">'+p.per_lokasi.map(x=>esc(x.lokasi)+": "+x.n).join(" · ")+'</div>':''))+
        '<button class="btn s" data-salin="'+i+'">Salin ringkasan untuk WA</button><div class="okb" id="ok'+i+'" hidden></div><pre id="tx'+i+'" hidden></pre></div>'}).join("");
    el.querySelectorAll("[data-salin]").forEach(b=>b.onclick=async()=>{
      const i=b.dataset.salin,tx=teksProgres(P[i]),pre=$("#tx"+i),ok=$("#ok"+i);pre.textContent=tx;pre.hidden=false;ok.hidden=false;
      try{await navigator.clipboard.writeText(tx);ok.textContent="Tersalin. Buka WhatsApp lalu tempel di grup."}
      catch(e){try{const g=document.createRange();g.selectNodeContents(pre);const sel=getSelection();sel.removeAllRanges();sel.addRange(g)}catch(_){}ok.textContent="Teks sudah diblok di bawah; tekan lama lalu pilih Salin."}
    });
  }catch(e){el.innerHTML='<div class="err">'+esc(pesanGalat(e))+'</div>'}
}

async function muatCalon(k){
  $("#daftar").innerHTML='<p class="mut">Memuat daftar alat...</p>';
  try{
    const r=await sb.from("alat").select(KOLOM).eq("customer_id",rsPilih).is("kode_qr",null).order("tipe").order("sn").limit(1000);

function gambarCalon(k){
  const q=$("#cari").value.trim().toLowerCase(),el=$("#daftar");
  const qk=kunciSN(q);
  const cocok=a=>!q||[a.sn,a.nama,a.merk,a.tipe,a.departemen].some(x=>String(x||"").toLowerCase().includes(q))||(qk&&kunciSN(a.sn).includes(qk));
  const adaSN=CAL.filter(a=>a.sn&&cocok(a)), tanpa=CAL.filter(a=>!a.sn&&cocok(a));
  // nomor seri yang persis sama dengan ketikan tampil paling atas
  adaSN.sort((a,b)=>(kunciSN(b.sn)===qk)-(kunciSN(a.sn)===qk));
  const grup={};tanpa.forEach(a=>{const g=alatTxt(a);(grup[g]=grup[g]||[]).push(a)});
  let h='<p class="mut">'+CAL.length+' alat di RS ini belum berstiker.</p>';
  Object.keys(grup).forEach(g=>{h+='<button class="item" data-id="'+grup[g][0].id+'"><b>'+esc(g)+'</b><span>Tanpa nomor seri, '+grup[g].length+' unit belum berstiker. Nomor seri diisi di langkah berikut.</span></button>'});
  adaSN.slice(0,30).forEach(a=>{h+='<button class="item" data-id="'+a.id+'"><b>SN '+esc(a.sn)+'</b><span>'+esc(alatTxt(a))+(a.departemen?" · "+esc(a.departemen):"")+' · '+esc(a.status)+'</span></button>'});
  if(adaSN.length>30)h+='<p class="mut">Menampilkan 30 dari '+adaSN.length+'. Ketik nomor seri untuk mempersempit.</p>';
  if(!adaSN.length&&!tanpa.length)h+='<p class="mut">Tidak ada alat yang cocok. Periksa rumah sakitnya, atau pakai tombol di bawah.</p>';
  el.innerHTML=h;
  el.querySelectorAll("[data-id]").forEach(b=>b.onclick=()=>{const a=CAL.find(x=>String(x.id)===b.dataset.id);if(a)layarIsi(k,a,false)});
}

// ---------- isi lokasi lalu simpan ------------------------------------
function layarIsi(k,a,ubah){
  judul((ubah?"Ubah ":"Daftarkan ")+k);
  const d={dept:a.departemen||ls.get("pt3d_dept")||"",ruang:a.ruangan||(ubah?"":ls.get("pt3d_ruang")||""),
           menetap:a.menetap!=null?a.menetap:(ls.get("pt3d_menetap")===null?null:ls.get("pt3d_menetap")==="1")};
  const perluInstal=!ubah&&(a.baru||BELUM_PASANG.includes(a.status));
  let LR=[],izinSN="";
  v.innerHTML='<div class="kode">'+esc(k)+'</div>'+
   (a.baru?'<div class="card"><b>Alat baru di '+esc(rsNama(a.customer_id))+'</b>'+
     '<label for="nm">Nama alat</label><input type="text" id="nm" placeholder="contoh: Patient Monitor">'+
     '<label for="mk">Merk</label><input type="text" id="mk">'+
     '<label for="tp">Tipe</label><input type="text" id="tp"></div>'
    :'<div class="card"><b>'+esc(alatTxt(a))+'</b><div class="mut">'+esc(rsNama(a.customer_id))+' · '+esc(a.status)+'</div></div>')+
   '<label for="sn">Nomor seri (dari label alat)</label><input type="text" id="sn" autocapitalize="characters" autocomplete="off" value="'+esc(a.sn||"")+'">'+
   (a.sn&&!ubah?'<div class="mut">Cocokkan dengan label di alat. Kalau berbeda, berarti alat yang dipilih salah: kembali dan pilih ulang.</div>':'')+
   '<label for="dps">Departemen / ruangan</label><select id="dps" hidden></select><input type="text" id="dp" placeholder="contoh: ICU" value="'+esc(d.dept)+'">'+
   '<label>Penempatan</label><div class="chips"><button class="chip'+(d.menetap===true?" on":"")+'" data-m="1">Menetap</button><button class="chip'+(d.menetap===false?" on":"")+'" data-m="0">Mobile</button></div>'+
   '<label for="rg">Ruangan / bed (bila menetap)</label><input type="text" id="rg" placeholder="contoh: ICU Dewasa bed 3" value="'+esc(d.ruang)+'">'+
   (perluInstal?'<label class="check"><input type="checkbox" id="ins" checked> Tandai terpasang di ruangan</label><label for="ti">Tanggal instal</label><input type="date" id="ti" value="'+hariIni()+'">':'')+
   '<div class="err" id="err"></div><button class="btn" id="simpan">'+(ubah?"Simpan perubahan":"Simpan: "+esc(k)+" untuk alat ini")+'</button>'+
   '<button class="btn s" id="batal">Kembali</button>';
  v.querySelectorAll("[data-m]").forEach(b=>b.onclick=()=>{d.menetap=b.dataset.m==="1";v.querySelectorAll("[data-m]").forEach(x=>x.classList.toggle("on",x===b))});
  $("#batal").onclick=()=>ubah?layarAlat(a,""):layarDaftar(k);
  ruanganRS(a.customer_id).then(L=>{const S=$("#dps"),I=$("#dp");if(!S||!I||!L.length)return;LR=L;
    const kini=samakanDept(a.departemen||d.dept,L),ada=L.includes(kini);
    if(!ada&&!a.departemen)I.value="";
    S.innerHTML='<option value="">(pilih ruangan)</option>'+L.map(x=>'<option value="'+esc(x)+'"'+(ada&&x===kini?" selected":"")+'>'+esc(x)+'</option>').join("")+'<option value="__lain"'+(!ada&&I.value?" selected":"")+'>Ruangan lain, ketik sendiri</option>';
    S.hidden=false;I.hidden=S.value!=="__lain";I.placeholder="ketik nama ruangan";
    S.onchange=()=>{I.hidden=S.value!=="__lain";if(!I.hidden){I.value="";I.focus()}};
  });
  $("#simpan").onclick=async()=>{
    const E=$("#err"),B=$("#simpan");E.textContent="";
    const S=$("#dps"),pakaiPilih=S&&!S.hidden&&S.value!=="__lain";
    const sn=$("#sn").value.trim(),dept=pakaiPilih?S.value:samakanDept($("#dp").value,LR),ruang=$("#rg").value.trim();
    const isi={sn:sn||null,departemen:dept||null,ruangan:ruang||null,menetap:d.menetap};
    if(a.baru){isi.nama=$("#nm").value.trim();isi.merk=$("#mk").value.trim()||null;isi.tipe=$("#tp").value.trim()||null;
      if(!isi.nama){E.textContent="Nama alat wajib diisi.";return}
      if(!sn){E.textContent="Nomor seri wajib diisi untuk alat baru.";return}}
    if(!dept){E.textContent="Departemen wajib diisi.";return}
    if(d.menetap==null){E.textContent="Pilih penempatan: Menetap atau Mobile.";return}
    if(perluInstal&&$("#ins").checked){const t=$("#ti").value;if(!t){E.textContent="Isi tanggal instal.";return}isi.status="Terpasang";isi.tgl_instal=t}
    B.disabled=true;B.textContent="Menyimpan...";
    if(sn&&(a.baru||kunciSN(sn)!==kunciSN(a.sn))){
      const tp=a.baru?isi.tipe:a.tipe,K=await snKembar(a.customer_id,sn,a.baru?null:a.id),sama=K.filter(o=>!bedaTipe(o,tp));
      const sebut=o=>alatTxt(o)+(o.departemen?" ("+o.departemen+")":"");
      const batalSimpan=m=>{E.textContent=m;B.disabled=false;B.textContent=ubah?"Simpan perubahan":"Simpan: "+k+" untuk alat ini"};
      if(sama.length){batalSimpan("Nomor seri "+sama[0].sn+" sudah ada di daftar: "+sebut(sama[0])+". "+(a.baru?"Kembali, lalu pilih alat itu dari daftar.":"Periksa lagi nomor serinya."));return}
      if(K.length&&izinSN!==kunciSN(sn)){izinSN=kunciSN(sn);batalSimpan("Nomor seri yang sama dipakai alat lain: "+sebut(K[0])+". Kalau ini memang alat yang berbeda, tekan Simpan sekali lagi.");return}
    }
    try{
      let r;
      if(a.baru){isi.customer_id=a.customer_id;isi.kode_qr=k;if(!isi.status)isi.status="Akan diinstal";
        r=await sb.from("alat").insert(isi).select(KOLOM).maybeSingle();}
      else if(ubah){r=await sb.from("alat").update(isi).eq("id",a.id).select(KOLOM).maybeSingle();}
      else{isi.kode_qr=k;r=await sb.from("alat").update(isi).eq("id",a.id).is("kode_qr",null).select(KOLOM).maybeSingle();}
      if(r.error)throw r.error;
      if(!r.data)throw new Error(ubah?"Perubahan tidak tersimpan. Muat ulang lalu coba lagi.":"Alat ini baru saja diberi stiker lain. Kembali dan pilih alat yang benar.");
      ls.set("pt3d_dept",dept);ls.set("pt3d_ruang",ruang);ls.set("pt3d_menetap",d.menetap?"1":"0");
      layarAlat(r.data,ubah?"Perubahan tersimpan.":"Tersimpan. Stiker "+k+" terdaftar untuk alat ini.");
      window.scrollTo(0,0);
    }catch(e){E.textContent=pesanGalat(e);B.disabled=false;B.textContent=ubah?"Simpan perubahan":"Simpan: "+k+" untuk alat ini"}
  };
}
mulai();
</script>
</body>
</html>
